<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scratch Academy</title>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCFYXIvbofB4NRcCqXtKUgJYAq5jkrAYGI",
  authDomain: "scratch-acedemy.firebaseapp.com",
  databaseURL: "https://scratch-acedemy-default-rtdb.firebaseio.com",
  projectId: "scratch-acedemy",
  storageBucket: "scratch-acedemy.firebasestorage.app",
  messagingSenderId: "384466833002",
  appId: "1:384466833002:web:8a586cbabb9ea4e120c413",
  measurementId: "G-TKNV52R40P"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

window.db = db;
window.ref = ref;
window.push = push;
window.onValue = onValue;
window.remove = remove;
</script>

<!-- CHART -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  color:white;
}
header{
  text-align:center;
  padding:20px;
  background:#111;
}
.container{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
}
.card{
  background:#1e1e1e;
  margin:15px;
  padding:20px;
  border-radius:15px;
  width:300px;
  box-shadow:0 0 15px rgba(0,255,255,0.3);
}
.profile img{
  width:100%;
  border-radius:15px;
  margin-bottom:10px;
}
button{
  background:linear-gradient(45deg,cyan,blue);
  border:none;
  padding:10px;
  margin:5px;
  border-radius:10px;
  cursor:pointer;
  color:white;
  width:100%;
}
button:hover{
  transform:scale(1.05);
}
#leaderboard li{
  background:#222;
  margin:5px;
  padding:10px;
  border-radius:10px;
}
.adminUser{
  background:#111;
  border:1px solid cyan;
  margin:10px;
  padding:10px;
  border-radius:10px;
  display:flex;
  justify-content:space-between;
}
.deleteBtn{
  background:red;
}
#adminPanel{
  display:none;
  padding:20px;
}
.stats{
  background:black;
  padding:10px;
  margin:10px;
  border:1px solid cyan;
}
input{
  padding:10px;
  width:100%;
  margin-bottom:10px;
  border-radius:10px;
  border:none;
}
</style>
</head>

<body>

<header>
<h1>🚀 Scratch Academy</h1>
</header>

<div class="container">

<!-- PROFILE -->
<div class="card profile">
<img src="jamil.jpg">
<h2>👨‍💻 Profile</h2>
<p><b>Name:</b> Jamil Bakri</p>
<p><b>Age:</b> 10</p>
<p><b>Phone:</b> +357 94 020504</p>
<p><b>Level:</b> Scratch Instructor</p>
</div>

<!-- QUIZ -->
<div class="card">
<h2>🧠 Quiz</h2>
<button onclick="answer(true)">Scratch = Programming</button>
<button onclick="answer(false)">Scratch = Game</button>
<p id="result"></p>
</div>

<!-- LEADERBOARD -->
<div class="card">
<h2>🌍 Global Leaderboard</h2>
<input id="gmail" placeholder="Enter Gmail">
<button onclick="saveScore()">Save Score</button>
<ul id="leaderboard"></ul>
</div>

<!-- TUTORIALS -->
<div class="card">
<h2>🎬 Scratch Tutorials</h2>

<button onclick="openLink('https://scratch.mit.edu/projects/editor/?tutorial=all')">
💡 All Ideas
</button>

<button onclick="openLink('https://scratch.mit.edu/projects/editor/?tutorial=getStarted')">
🚀 Get Started
</button>

<button onclick="openLink('https://scratch.mit.edu/starter-projects')">
📚 Starter Projects
</button>

<button onclick="openLink('https://scratch.mit.edu/explore/projects/games/')">
🎮 Explore Games
</button>

</div>

</div>

<div style="text-align:center;">
<button onclick="openAdmin()">🛠️ Admin Panel</button>
</div>

<!-- ADMIN -->
<div id="adminPanel">
<h2>🛠️ Admin Dashboard</h2>

<div class="stats" id="totalUsers">Users: 0</div>
<div class="stats" id="avgScore">Average: 0</div>

<canvas id="chart"></canvas>

<h3>🌍 All Users</h3>
<div id="adminUsers"></div>
</div>

<script>
let progress = 0;
let chart;

function answer(correct){
  if(correct){
    progress += 10;
    document.getElementById("result").innerText = "Correct ✅";
  } else {
    document.getElementById("result").innerText = "Wrong ❌";
  }
}

function saveScore(){
  let email = document.getElementById("gmail").value;
  if(!email.includes("@")){
    alert("Enter valid Gmail");
    return;
  }
  push(ref(db,"leaderboard"),{
    name: email,
    score: progress
  });
}

function loadLeaderboard(){
  onValue(ref(db,"leaderboard"),(snapshot)=>{
    let data = snapshot.val();
    let list = document.getElementById("leaderboard");
    let admin = document.getElementById("adminUsers");

    list.innerHTML = "";
    admin.innerHTML = "";

    if(!data) return;

    let arr = [];
    let total = 0;

    for(let id in data){
      arr.push({id,...data[id]});
      total += data[id].score;
    }

    arr.sort((a,b)=>b.score-a.score);

    document.getElementById("totalUsers").innerText = "Users: " + arr.length;
    document.getElementById("avgScore").innerText = "Average: " + Math.round(total / arr.length);

    updateChart(arr);

    arr.forEach((u,i)=>{
      let medal = i==0?"🥇":i==1?"🥈":i==2?"🥉":"";

      let li = document.createElement("li");
      li.innerText = `${medal} ${u.name} - ${u.score}%`;
      list.appendChild(li);

      let div = document.createElement("div");
      div.className = "adminUser";
      div.innerHTML = `
        ${u.name} - ${u.score}%
        <button class="deleteBtn" onclick="deleteUser('${u.id}')">Delete</button>
      `;
      admin.appendChild(div);
    });
  });
}

function updateChart(data){
  let labels = data.slice(0,5).map(u=>u.name);
  let scores = data.slice(0,5).map(u=>u.score);

  if(chart) chart.destroy();

  chart = new Chart(document.getElementById("chart"),{
    type:"bar",
    data:{
      labels: labels,
      datasets:[{
        label:"Top Scores",
        data: scores
      }]
    }
  });
}

function deleteUser(id){
  if(confirm("Delete user?")){
    remove(ref(db,"leaderboard/"+id));
  }
}

function openAdmin(){
  let pass = prompt("Password:");
  if(pass === "jamil"){
    document.getElementById("adminPanel").style.display = "block";
  } else {
    alert("Wrong password!");
  }
}

function openLink(url){
  window.open(url,"_blank");
}

window.onload = loadLeaderboard;
</script>

</body>
</html>
