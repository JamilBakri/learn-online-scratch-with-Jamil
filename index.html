<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scratch Academy - Jamil Bakri</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  color:white;
}
header{
  text-align:center;
  padding:20px;
  background:#ff7b00;
}
header img{width:60px}

.container{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  padding:20px;
}
.card{
  background:#1e1e1e;
  margin:10px;
  padding:20px;
  border-radius:15px;
  width:300px;
  box-shadow:0 0 15px rgba(0,0,0,0.5);
}

.profile img{
  width:100%;
  border-radius:10px;
}

button{
  width:100%;
  padding:10px;
  margin:5px 0;
  border:none;
  border-radius:10px;
  background:linear-gradient(45deg,#ff7b00,#ffae00);
  cursor:pointer;
}
button:hover{transform:scale(1.05)}

.bar{
  background:#333;
  border-radius:10px;
}
.bar-inner{
  height:20px;
  width:0%;
  background:lime;
  border-radius:10px;
}

/* 🔥 LEADERBOARD ANIMATION */
.leader-item{
  padding:8px;
  margin:5px 0;
  border-radius:10px;
  background:#222;
  opacity:0;
  transform:translateY(20px);
  animation:fadeIn 0.5s forwards;
}
@keyframes fadeIn{
  to{opacity:1;transform:translateY(0);}
}
