<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scratch Academy</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    color:white;
}

header{
    text-align:center;
    padding:20px;
    background:#111;
    box-shadow:0 0 20px cyan;
}

header img{
    width:80px;
}

.container{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
}

.card{
    background:#1e1e1e;
    margin:15px;
    padding:20px;
    border-radius:15px;
    width:300px;
    box-shadow:0 0 15px rgba(0,255,255,0.3);
}

.profile img{
    width:100%;
    border-radius:15px;
}

button{
    background:linear-gradient(45deg,cyan,blue);
    border:none;
    padding:10px;
    margin:5px;
    border-radius:10px;
    cursor:pointer;
    color:white;
}

button:hover{
    transform:scale(1.1);
}

#leaderboard li{
    margin:10px;
    padding:10px;
    background:#222;
    border-radius:10px;
    list-style:none;
}

#adminPanel{
    display:none;
    background:#000;
    padding:20px;
    margin:20px;
    border:2px solid red;
}
</style>
</head>

<body>

<header>
<img src="https://upload.wikimedia.org/wikipedia/commons/7/75/Scratch.logo.S.png">
<h1>🚀 Scratch Academy</h1>
</header>

<div class="container">

<div class="card profile">
<img src="jamil.jpg">
<h2>👤 Jamil Bakri</h2>
<p>Age: 10</p>
<p>Instructor of Scratch</p>
<p>📞 +357 94020504</p>
</div>

<div class="card">
<h2>🎬 Tutorials</h2>
<button onclick="openLink('https://scratch.mit.edu/projects/editor/?tutorial=all')">💡 Ideas</button>
<button onclick="openLink('https://scratch.mit.edu/projects/editor/?tutorial=getStarted')">🚀 Get Started</button>
<button onclick="openLink('https://scratch.mit.edu/starter-projects')">📚 Tutorials</button>
</div>

<div class="card">
<h2>📊 Progress</h2>
<progress id="progressBar" value="0" max="100"></progress>
<p id="progressText">0%</p>
</div>

<div class="card">
<h2>🏆 Badge</h2>
<p id="badge">Beginner 🟢</p>
</div>

<div class="card">
<h2>🧠 Quiz</h2>
<p>What is Scratch?</p>
<button onclick="answer(true)">Programming Language</button>
<button onclick="answer(false)">Game</button>
<p id="result"></p>
</div>

<div class="card">
<h2>🌍 Leaderboard</h2>
<input id="username" placeholder="Your name">
<input type="file" id="avatarInput">
<button onclick="saveScore()">Save Score</button>
<ul id="leaderboard"></ul>
</div>

<div class="card">
<h2>🎓 Certificate</h2>
<button onclick="generateCertificate()">Get Certificate</button>
</div>

</div>

<div style="text-align:center;">
<button onclick="openAdmin()">🛠️ Admin Panel</button>
</div>

<div id="adminPanel">
<h2>Admin Panel</h2>
<button onclick="resetProgress()">Reset Progress</button>
<button onclick="clearLeaderboard()">Clear Leaderboard</button>

<h3>🎓 Certificates</h3>
<ul id="certList"></ul>
</div>

<audio id="sound" src="https://www.soundjay.com/buttons/sounds/button-3.mp3"></audio>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<script>
let progress=0;
let lastTop="";

// LINKS
function openLink(url){
    window.open(url,"_blank");
}

// QUIZ
function answer(correct){
    let res=document.getElementById("result");

    if(correct){
        res.innerText="Correct ✅";
        addProgress(10);
    }else{
        res.innerText="Wrong ❌";
    }
}

// PROGRESS
function addProgress(val){
    progress+=val;
    if(progress>100)progress=100;

    document.getElementById("progressBar").value=progress;
    document.getElementById("progressText").innerText=progress+"%";

    updateBadge();
    localStorage.setItem("progress",progress);
}

// BADGE
function updateBadge(){
    let b=document.getElementById("badge");

    if(progress>=100)b.innerText="Master 🔥";
    else if(progress>=60)b.innerText="Pro ⚡";
    else if(progress>=30)b.innerText="Intermediate 💡";
    else b.innerText="Beginner 🟢";
}

// LOAD
window.onload=function(){
    let saved=localStorage.getItem("progress");
    if(saved){
        progress=parseInt(saved);
        document.getElementById("progressBar").value=progress;
        document.getElementById("progressText").innerText=progress+"%";
        updateBadge();
    }
    loadLeaderboard();
};

// LEADERBOARD
function saveScore(){
    let name=document.getElementById("username").value||"Player";
    let file=document.getElementById("avatarInput").files[0];

    let reader=new FileReader();

    reader.onload=function(){
        let data=JSON.parse(localStorage.getItem("leaderboard"))||[];

        data.push({
            name:name,
            score:progress,
            avatar:reader.result||"https://via.placeholder.com/40"
        });

        localStorage.setItem("leaderboard",JSON.stringify(data));
        loadLeaderboard();
    };

    if(file)reader.readAsDataURL(file);
    else reader.onload();
}

function loadLeaderboard(){
    let data=JSON.parse(localStorage.getItem("leaderboard"))||[];

    data.sort((a,b)=>b.score-a.score);

    let list=document.getElementById("leaderboard");
    list.innerHTML="";

    data.forEach((u,i)=>{
        let medal="";
        if(i==0)medal="🥇";
        else if(i==1)medal="🥈";
        else if(i==2)medal="🥉";

        let li=document.createElement("li");

        li.innerHTML=`${medal}
        <img src="${u.avatar}" width="40" style="border-radius:50%;">
        ${u.name} - ${u.score}%`;

        list.appendChild(li);
    });

    if(data[0] && data[0].name!==lastTop){
        document.getElementById("sound").play();
        lastTop=data[0].name;
    }
}

setInterval(loadLeaderboard,3000);

// CERTIFICATE
function generateCertificate(){
    let name=document.getElementById("username").value||"Student";
    let certID="SCR-"+Math.floor(Math.random()*1000000);
    let today=new Date().toLocaleDateString();

    // SAVE CERT
    let certs=JSON.parse(localStorage.getItem("certificates"))||[];
    certs.push({name:name,score:progress,date:today,id:certID});
    localStorage.setItem("certificates",JSON.stringify(certs));

    let win=window.open("");

    win.document.write(`
    <html>
    <head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"><\/script>
    <style>
    body{font-family:Georgia;text-align:center;background:#eee;}
    .cert{background:white;margin:20px;padding:40px;border:10px solid gold;}
    .name{font-size:35px;font-weight:bold;}
    </style>
    </head>
    <body>

    <div id="cert" class="cert">
    <img src="https://upload.wikimedia.org/wikipedia/commons/7/75/Scratch.logo.S.png" width="80">
    <h1>Certificate of Achievement</h1>
    <p>Awarded to</p>
    <div class="name">${name}</div>
    <p>Score: ${progress}%</p>
    <p>Date: ${today}</p>
    <p>Instructor: Jamil Bakri</p>
    <p>ID: ${certID}</p>
    <img src="signature.png" width="120">
    </div>

    <button onclick="html2pdf().from(document.getElementById('cert')).save()">Download PDF</button>

    </body>
    </html>
    `);
}

// ADMIN
function openAdmin(){
    let pass=prompt("Password:");
    if(pass==="jamil"){
        document.getElementById("adminPanel").style.display="block";
        loadCertificates();
    }
}

function loadCertificates(){
    let certs=JSON.parse(localStorage.getItem("certificates"))||[];
    let list=document.getElementById("certList");
    list.innerHTML="";

    certs.forEach(c=>{
        let li=document.createElement("li");
        li.innerHTML=`${c.name} | ${c.score}% <br> ${c.id} | ${c.date}`;
        list.appendChild(li);
    });
}

function resetProgress(){
    localStorage.removeItem("progress");
    location.reload();
}

function clearLeaderboard(){
    localStorage.removeItem("leaderboard");
    loadLeaderboard();
}
</script>

</body>
</html>
