<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scratch Academy</title>

<!-- FIREBASE (MODULE) -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "PASTE_KEY",
  authDomain: "PASTE_DOMAIN",
  databaseURL: "PASTE_DB_URL",
  projectId: "PASTE",
  storageBucket: "PASTE",
  messagingSenderId: "PASTE",
  appId: "PASTE"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// make global
window.db = db;
window.ref = ref;
window.push = push;
window.onValue = onValue;
window.remove = remove;
</script>

<style>
body{
    margin:0;
    font-family:Arial;
    background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    color:white;
}
header{
    text-align:center;
    padding:20px;
    background:#111;
    box-shadow:0 0 20px cyan;
}
header img{width:80px;}
.container{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
}
.card{
    background:#1e1e1e;
    margin:15px;
    padding:20px;
    border-radius:15px;
    width:300px;
    box-shadow:0 0 15px rgba(0,255,255,0.3);
}
.profile img{
    width:100%;
    border-radius:15px;
}
button{
    background:linear-gradient(45deg,cyan,blue);
    border:none;
    padding:10px;
    margin:5px;
    border-radius:10px;
    cursor:pointer;
    color:white;
}
button:hover{transform:scale(1.1);}
#leaderboard li{
    margin:10px;
    padding:10px;
    background:#222;
    border-radius:10px;
    list-style:none;
}
#adminPanel{
    display:none;
    background:#000;
    padding:20px;
    margin:20px;
    border:2px solid red;
}
</style>
</head>

<body>

<header>
<img src="https://upload.wikimedia.org/wikipedia/commons/7/75/Scratch.logo.S.png">
<h1>🚀 Scratch Academy</h1>
</header>

<div class="container">

<!-- PROFILE -->
<div class="card profile">
<img src="jamil.jpg">
<h2>👤 Jamil Bakri</h2>
<p>Age: 10</p>
<p>Instructor of Scratch</p>
<p>📞 +357 94020504</p>
</div>

<!-- TUTORIALS -->
<div class="card">
<h2>🎬 Tutorials</h2>
<button onclick="openLink('https://scratch.mit.edu/projects/editor/?tutorial=all')">💡 Ideas</button>
<button onclick="openLink('https://scratch.mit.edu/projects/editor/?tutorial=getStarted')">🚀 Get Started</button>
<button onclick="openLink('https://scratch.mit.edu/starter-projects')">📚 Tutorials</button>
</div>

<!-- PROGRESS -->
<div class="card">
<h2>📊 Progress</h2>
<progress id="progressBar" value="0" max="100"></progress>
<p id="progressText">0%</p>
</div>

<!-- BADGE -->
<div class="card">
<h2>🏆 Badge</h2>
<p id="badge">Beginner 🟢</p>
</div>

<!-- QUIZ -->
<div class="card">
<h2>🧠 Quiz</h2>
<p>What is Scratch?</p>
<button onclick="answer(true)">Programming Language</button>
<button onclick="answer(false)">Game</button>
<p id="result"></p>
</div>

<!-- GLOBAL LEADERBOARD -->
<div class="card">
<h2>🌍 Global Leaderboard</h2>
<input id="gmail" placeholder="Enter your Gmail">
<button onclick="saveScore()">Save Score</button>
<ul id="leaderboard"></ul>
</div>

<!-- CERTIFICATE -->
<div class="card">
<h2>🎓 Certificate</h2>
<button onclick="generateCertificate()">Get Certificate</button>
</div>

</div>

<div style="text-align:center;">
<button onclick="openAdmin()">🛠️ Admin Panel</button>
</div>

<!-- ADMIN PANEL -->
<div id="adminPanel">
<h2>🛠️ Admin Dashboard</h2>
<h3>🌍 All Users</h3>
<ul id="adminUsers"></ul>
</div>

<script>
let progress=0;

// EMAIL
function isValidEmail(email){
    return email.includes("@") && email.includes(".");
}

// LINKS
function openLink(url){
    window.open(url,"_blank");
}

// QUIZ
function answer(correct){
    if(correct){
        document.getElementById("result").innerText="Correct ✅";
        addProgress(10);
    }else{
        document.getElementById("result").innerText="Wrong ❌";
    }
}

// PROGRESS
function addProgress(val){
    progress+=val;
    if(progress>100)progress=100;

    document.getElementById("progressBar").value=progress;
    document.getElementById("progressText").innerText=progress+"%";

    localStorage.setItem("progress",progress);
    updateBadge();
}

function updateBadge(){
    let b=document.getElementById("badge");
    if(progress>=100)b.innerText="Master 🔥";
    else if(progress>=60)b.innerText="Pro ⚡";
    else if(progress>=30)b.innerText="Intermediate 💡";
    else b.innerText="Beginner 🟢";
}

// LOAD
window.onload=function(){
    let saved=localStorage.getItem("progress");
    if(saved){
        progress=parseInt(saved);
        document.getElementById("progressBar").value=progress;
        document.getElementById("progressText").innerText=progress+"%";
        updateBadge();
    }
    loadLeaderboard();
};

// SAVE SCORE (GLOBAL)
function saveScore(){
    let email=document.getElementById("gmail").value;

    if(!isValidEmail(email)){
        alert("Enter valid Gmail");
        return;
    }

    push(ref(db,"leaderboard"),{
        name:email,
        score:progress
    });
}

// LOAD LEADERBOARD
function loadLeaderboard(){
    onValue(ref(db,"leaderboard"),(snapshot)=>{
        let data=snapshot.val();
        let list=document.getElementById("leaderboard");
        list.innerHTML="";

        let arr=[];

        for(let id in data){
            arr.push({id,...data[id]});
        }

        arr.sort((a,b)=>b.score-a.score);

        arr.forEach((u,i)=>{
            let medal="";
            if(i==0)medal="🥇";
            else if(i==1)medal="🥈";
            else if(i==2)medal="🥉";

            let li=document.createElement("li");
            li.innerHTML=`${medal} ${u.name} - ${u.score}%`;
            list.appendChild(li);
        });
    });
}

// ADMIN LOAD USERS
function loadAdminUsers(){
    onValue(ref(db,"leaderboard"),(snapshot)=>{
        let data=snapshot.val();
        let list=document.getElementById("adminUsers");
        list.innerHTML="";

        for(let id in data){
            let u=data[id];

            let li=document.createElement("li");
            li.innerHTML=`
            🧑 ${u.name} - ${u.score}%
            <button onclick="deleteUser('${id}')">❌ Delete</button>
            `;
            list.appendChild(li);
        }
    });
}

// DELETE USER
function deleteUser(id){
    if(confirm("Delete user?")){
        remove(ref(db,"leaderboard/"+id));
    }
}

// ADMIN LOGIN
function openAdmin(){
    let pass=prompt("Enter Admin Password:");
    if(pass==="jamil"){
        document.getElementById("adminPanel").style.display="block";
        loadAdminUsers();
    }else{
        alert("Wrong password");
    }
}

// CERTIFICATE
function generateCertificate(){
    let email=document.getElementById("gmail").value;

    if(!isValidEmail(email)){
        alert("Enter Gmail first");
        return;
    }

    let id="SCR-"+Math.floor(Math.random()*1000000);
    let date=new Date().toLocaleDateString();

    let win=window.open("");

    win.document.write(`
    <html>
    <body style="text-align:center;font-family:Georgia;">
    <h1>Certificate of Achievement</h1>
    <h2>${email}</h2>
    <p>Score: ${progress}%</p>
    <p>Date: ${date}</p>
    <p>ID: ${id}</p>
    <p>Awarded by Jamil Bakri</p>
    <button onclick="window.print()">Download PDF</button>
    </body>
    </html>
    `);
}
</script>

</body>
</html>
