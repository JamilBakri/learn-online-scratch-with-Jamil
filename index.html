<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scratch Academy</title>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "PASTE_KEY",
  authDomain: "PASTE_DOMAIN",
  databaseURL: "PASTE_DB_URL",
  projectId: "PASTE",
  storageBucket: "PASTE",
  messagingSenderId: "PASTE",
  appId: "PASTE"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

window.db = db;
window.ref = ref;
window.push = push;
window.onValue = onValue;
window.remove = remove;
</script>

<!-- CHART.JS -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
    margin:0;
    font-family:Arial;
    background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    color:white;
}
header{
    text-align:center;
    padding:20px;
    background:#111;
    box-shadow:0 0 20px cyan;
}
.container{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
}
.card{
    background:#1e1e1e;
    margin:15px;
    padding:20px;
    border-radius:15px;
    width:300px;
    box-shadow:0 0 15px rgba(0,255,255,0.3);
}
button{
    background:linear-gradient(45deg,cyan,blue);
    border:none;
    padding:10px;
    margin:5px;
    border-radius:10px;
    cursor:pointer;
    color:white;
}
.adminUser{
    background:#111;
    border:1px solid cyan;
    padding:10px;
    margin:10px;
    border-radius:12px;
    display:flex;
    justify-content:space-between;
}
.deleteBtn{
    background:red;
    border:none;
    padding:5px;
    border-radius:6px;
    cursor:pointer;
}
#adminPanel{
    display:none;
    padding:20px;
}
.stats{
    margin:10px;
    padding:10px;
    background:#000;
    border:1px solid cyan;
}
</style>
</head>

<body>

<header>
<h1>🚀 Scratch Academy</h1>
</header>

<div class="container">

<div class="card">
<h2>🧠 Quiz</h2>
<button onclick="answer(true)">Scratch = Programming</button>
<button onclick="answer(false)">Scratch = Game</button>
<p id="result"></p>
</div>

<div class="card">
<h2>🌍 Leaderboard</h2>
<input id="gmail" placeholder="Enter Gmail">
<button onclick="saveScore()">Save Score</button>
<ul id="leaderboard"></ul>
</div>

</div>

<div style="text-align:center;">
<button onclick="openAdmin()">🛠️ Admin Panel</button>
</div>

<!-- ADMIN PANEL -->
<div id="adminPanel">
<h2>🛠️ Admin Dashboard</h2>

<div class="stats" id="totalUsers">Users: 0</div>
<div class="stats" id="avgScore">Average Score: 0</div>

<canvas id="chart"></canvas>

<h3>🌍 All Users</h3>
<div id="adminUsers"></div>
</div>

<script>
let progress=0;
let chart;

// QUIZ
function answer(correct){
    if(correct){
        progress+=10;
        document.getElementById("result").innerText="Correct ✅";
    }else{
        document.getElementById("result").innerText="Wrong ❌";
    }
}

// SAVE
function saveScore(){
    let email=document.getElementById("gmail").value;

    if(!email.includes("@")){
        alert("Enter valid Gmail");
        return;
    }

    push(ref(db,"leaderboard"),{
        name:email,
        score:progress
    });
}

// LOAD DATA
function loadLeaderboard(){
    onValue(ref(db,"leaderboard"),(snapshot)=>{
        let data=snapshot.val();
        let list=document.getElementById("leaderboard");
        let container=document.getElementById("adminUsers");

        list.innerHTML="";
        container.innerHTML="";

        let arr=[];
        let total=0;

        for(let id in data){
            arr.push({id,...data[id]});
            total+=data[id].score;
        }

        arr.sort((a,b)=>b.score-a.score);

        // leaderboard
        arr.forEach((u,i)=>{
            let li=document.createElement("li");
            li.innerHTML=`${u.name} - ${u.score}%`;
            list.appendChild(li);
        });

        // stats
        document.getElementById("totalUsers").innerText="Users: "+arr.length;
        document.getElementById("avgScore").innerText="Average Score: "+Math.round(total/arr.length || 0);

        // chart
        updateChart(arr);

        // admin users
        arr.forEach(u=>{
            let div=document.createElement("div");
            div.className="adminUser";
            div.innerHTML=`
            ${u.name} - ${u.score}%
            <button class="deleteBtn" onclick="deleteUser('${u.id}')">Delete</button>
            `;
            container.appendChild(div);
        });
    });
}

// CHART
function updateChart(data){
    let labels=data.slice(0,5).map(u=>u.name);
    let scores=data.slice(0,5).map(u=>u.score);

    if(chart) chart.destroy();

    chart=new Chart(document.getElementById("chart"),{
        type:"bar",
        data:{
            labels:labels,
            datasets:[{
                label:"Top Scores",
                data:scores
            }]
        }
    });
}

// DELETE
function deleteUser(id){
    if(confirm("Delete?")){
        remove(ref(db,"leaderboard/"+id));
    }
}

// ADMIN
function openAdmin(){
    let pass=prompt("Password:");
    if(pass==="jamil"){
        document.getElementById("adminPanel").style.display="block";
        loadLeaderboard();
    }
}

// INIT
window.onload=loadLeaderboard;
</script>

</body>
</html>
