<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scratch Academy</title>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "PASTE_KEY",
  authDomain: "PASTE_DOMAIN",
  databaseURL: "PASTE_DB_URL",
  projectId: "PASTE",
  storageBucket: "PASTE",
  messagingSenderId: "PASTE",
  appId: "PASTE"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

window.db = db;
window.ref = ref;
window.push = push;
window.onValue = onValue;
window.remove = remove;
</script>

<style>
body{
    margin:0;
    font-family:Arial;
    background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    color:white;
}
header{
    text-align:center;
    padding:20px;
    background:#111;
    box-shadow:0 0 20px cyan;
}
header img{width:80px;}

.container{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
}

.card{
    background:#1e1e1e;
    margin:15px;
    padding:20px;
    border-radius:15px;
    width:300px;
    box-shadow:0 0 15px rgba(0,255,255,0.3);
}

button{
    background:linear-gradient(45deg,cyan,blue);
    border:none;
    padding:10px;
    margin:5px;
    border-radius:10px;
    cursor:pointer;
    color:white;
}
button:hover{transform:scale(1.1);}

#leaderboard li{
    margin:10px;
    padding:10px;
    background:#222;
    border-radius:10px;
    list-style:none;
}

/* ADMIN USERS BUTTON STYLE */
.adminUser{
    background:#111;
    border:1px solid cyan;
    padding:10px;
    margin:10px;
    border-radius:12px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 0 10px cyan;
}

.adminUser span{
    font-size:14px;
}

.deleteBtn{
    background:red;
    border:none;
    padding:5px 10px;
    border-radius:8px;
    cursor:pointer;
}

#adminPanel{
    display:none;
    padding:20px;
}
</style>
</head>

<body>

<header>
<img src="https://upload.wikimedia.org/wikipedia/commons/7/75/Scratch.logo.S.png">
<h1>🚀 Scratch Academy</h1>
</header>

<div class="container">

<div class="card">
<h2>🎬 Tutorials</h2>
<button onclick="openLink('https://scratch.mit.edu/projects/editor/?tutorial=all')">💡 Ideas</button>
<button onclick="openLink('https://scratch.mit.edu/projects/editor/?tutorial=getStarted')">🚀 Get Started</button>
<button onclick="openLink('https://scratch.mit.edu/starter-projects')">📚 Tutorials</button>
</div>

<div class="card">
<h2>🧠 Quiz</h2>
<button onclick="answer(true)">Scratch = Programming</button>
<button onclick="answer(false)">Scratch = Game</button>
<p id="result"></p>
</div>

<div class="card">
<h2>🌍 Global Leaderboard</h2>
<input id="gmail" placeholder="Enter Gmail">
<button onclick="saveScore()">Save Score</button>
<ul id="leaderboard"></ul>
</div>

</div>

<div style="text-align:center;">
<button onclick="openAdmin()">🛠️ Admin Panel</button>
</div>

<!-- ADMIN -->
<div id="adminPanel">
<h2>🛠️ Admin Dashboard</h2>
<h3>🌍 All Users</h3>
<div id="adminUsers"></div>
</div>

<script>
let progress=0;

function isValidEmail(email){
    return email.includes("@") && email.includes(".");
}

function openLink(url){
    window.open(url,"_blank");
}

function answer(correct){
    if(correct){
        progress+=10;
        document.getElementById("result").innerText="Correct ✅";
    }else{
        document.getElementById("result").innerText="Wrong ❌";
    }
}

// SAVE SCORE
function saveScore(){
    let email=document.getElementById("gmail").value;

    if(!isValidEmail(email)){
        alert("Enter valid Gmail");
        return;
    }

    push(ref(db,"leaderboard"),{
        name:email,
        score:progress
    });
}

// LOAD LEADERBOARD
function loadLeaderboard(){
    onValue(ref(db,"leaderboard"),(snapshot)=>{
        let data=snapshot.val();
        let list=document.getElementById("leaderboard");
        list.innerHTML="";

        let arr=[];

        for(let id in data){
            arr.push(data[id]);
        }

        arr.sort((a,b)=>b.score-a.score);

        arr.forEach((u,i)=>{
            let medal="";
            if(i==0)medal="🥇";
            else if(i==1)medal="🥈";
            else if(i==2)medal="🥉";

            let li=document.createElement("li");
            li.innerHTML=`${medal} ${u.name} - ${u.score}%`;
            list.appendChild(li);
        });
    });
}

// ADMIN USERS AS BUTTON CARDS
function loadAdminUsers(){
    onValue(ref(db,"leaderboard"),(snapshot)=>{
        let data=snapshot.val();
        let container=document.getElementById("adminUsers");
        container.innerHTML="";

        for(let id in data){
            let u=data[id];

            let div=document.createElement("div");
            div.className="adminUser";

            div.innerHTML=`
            <span>🧑 ${u.name} - ${u.score}%</span>
            <button class="deleteBtn" onclick="deleteUser('${id}')">Delete</button>
            `;

            container.appendChild(div);
        }
    });
}

// DELETE
function deleteUser(id){
    if(confirm("Delete user?")){
        remove(ref(db,"leaderboard/"+id));
    }
}

// ADMIN LOGIN
function openAdmin(){
    let pass=prompt("Password:");
    if(pass==="jamil"){
        document.getElementById("adminPanel").style.display="block";
        loadAdminUsers();
    }
}

// LOAD
window.onload=loadLeaderboard;
</script>

</body>
</html>
